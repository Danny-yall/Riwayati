<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <link rel="icon" type="image/png" href="img/riwayati.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayati</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { darkBg: '#0f172a', cardBg: '#1e293b' } }
            }
        }
    </script>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        header {color: #fff;}
        .serif-title { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .logo {width: 20%; cursor: pointer;}
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">

   <header class="sticky top-0 z-50  backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <img class="logo" src="img/riwayati.png" alt="riwayati logo">
               
                
            </a>
            
        </div>
    </header>

    <div id="toast" class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium text-white bg-emerald-600 flex items-center space-x-3 transition-all transform translate-y-10 opacity-0 pointer-events-none">
        <i class="fa-solid fa-circle-check"></i><span id="toast-msg">Action successful!</span>
    </div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <div class="bg-slate-900/50 p-6 sm:p-8 rounded-2xl border border-slate-800 shadow-xl backdrop-blur-sm">
            <div class="flex items-center justify-between pb-6 border-b border-slate-800">
                <div>
                    <h1 class="serif-title text-2xl sm:text-3xl font-bold text-slate-100" id="form-heading">Add New Novel</h1>
                    <p class="text-slate-400 text-sm mt-1">Upload cover images and PDFs (or supply web URLs).</p>
                </div>
                <button id="cancel-btn" onclick="resetForm()" class="hidden px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-all">
                    Cancel Edit
                </button>
            </div>

            <form id="novel-form" onsubmit="handleFormSubmit(event)" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="hidden" id="edit-id" value="">

                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Novel Title</label>
                    <input type="text" id="novel-title" required placeholder="e.g., The Starlight Odyssey" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Author Name</label>
                    <input type="text" id="novel-author" required placeholder="e.g., Clara Oswald" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Genre</label>
                    <input type="text" id="novel-genre" required placeholder="e.g., Fantasy, Sci-Fi" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Cover Image (URL or Upload File)</label>
                    <div class="flex gap-2">
                        <input type="text" id="novel-cover" required placeholder="https://... or upload image" class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-image mr-2"></i> File
                            <input type="file" accept="image/*" onchange="convertFileToBase64(event, 'novel-cover')" class="hidden">
                        </label>
                    </div>
                </div>

                <div class="space-y-2 md:col-span-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">PDF File (URL or Upload Local PDF)</label>
                    <div class="flex gap-2">
                        <input type="text" id="novel-pdf" required placeholder="https://... or upload PDF document" class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-file-pdf text-red-400 mr-2"></i> Upload PDF
                            <input type="file" accept="application/pdf" onchange="convertFileToBase64(event, 'novel-pdf')" class="hidden">
                        </label>
                    </div>
                </div>

                <div class="space-y-2 md:col-span-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Synopsis / Description</label>
                    <textarea id="novel-desc" rows="4" required placeholder="Enter description..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all"></textarea>
                </div>

                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" id="submit-btn" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-indigo-600/30 flex items-center">
                        <i class="fa-solid fa-plus mr-2"></i> Save & Publish Novel
                    </button>
                </div>
            </form>
        </div>

        <!-- Novel List Table -->
        <div class="bg-slate-900/50 p-6 sm:p-8 rounded-2xl border border-slate-800 shadow-xl backdrop-blur-sm space-y-6">
            <h2 class="serif-title text-xl font-bold text-slate-100">Existing Novels</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs uppercase tracking-wider text-slate-400">
                            <th class="py-3 px-4">Cover</th>
                            <th class="py-3 px-4">Title & Author</th>
                            <th class="py-3 px-4">Genre</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table" class="divide-y divide-slate-800 text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="db.js"></script>
    <script type="module">
        function showNotification(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 3000);
        }

        function convertFileToBase64(event, targetInputId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById(targetInputId).value = e.target.result;
                showNotification(`File loaded as Data URL!`);
            };
            reader.readAsDataURL(file);
        }

        async function renderAdminTable() {
            const novels = await getNovels();
            const tbody = document.getElementById('admin-table');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (!Array.isArray(novels) || novels.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">No novels found.</td></tr>`;
                return;
            }

            novels.forEach(novel => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <img src="${novel.cover}" class="w-10 h-14 object-cover rounded-lg border border-slate-700" onerror="this.src='https://placehold.co/100x150/1e293b/94a3b8?text=Cover'">
                    </td>
                    <td class="py-3 px-4">
                        <div class="font-semibold text-slate-200">${novel.title}</div>
                        <div class="text-xs text-slate-400">By ${novel.author}</div>
                    </td>
                    <td class="py-3 px-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-indigo-400 border border-slate-700">${novel.genre}</span>
                    </td>
                    <td class="py-3 px-4 text-right space-x-2">
                        <button onclick="window.editNovelItem('${novel.id}')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="window.deleteNovelItem('${novel.id}')" class="p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value || Date.now().toString();
            const novel = {
                id: id,
                title: document.getElementById('novel-title').value.trim(),
                author: document.getElementById('novel-author').value.trim(),
                genre: document.getElementById('novel-genre').value.trim(),
                cover: document.getElementById('novel-cover').value.trim(),
                pdf: document.getElementById('novel-pdf').value.trim(),
                desc: document.getElementById('novel-desc').value.trim()
            };

            await saveNovel(novel);
            showNotification('Novel saved successfully!');
            resetForm();
            await renderAdminTable();
        }

        async function editNovelItem(id) {
            const novels = await getNovels();
            if (!Array.isArray(novels)) return;
            const novel = novels.find(n => n.id === id);
            if (!novel) return;

            document.getElementById('edit-id').value = novel.id;
            document.getElementById('novel-title').value = novel.title;
            document.getElementById('novel-author').value = novel.author;
            document.getElementById('novel-genre').value = novel.genre;
            document.getElementById('novel-cover').value = novel.cover;
            document.getElementById('novel-pdf').value = novel.pdf;
            document.getElementById('novel-desc').value = novel.desc;

            document.getElementById('form-heading').innerText = "Edit Novel";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteNovelItem(id) {
            if (confirm("Are you sure you want to delete this novel?")) {
                await removeNovel(id);
                await renderAdminTable();
                showNotification('Novel deleted!');
            }
        }

        function resetForm() {
            document.getElementById('novel-form').reset();
            document.getElementById('edit-id').value = "";
            document.getElementById('form-heading').innerText = "Add New Novel";
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        // ربط الأحداث بـ window لضمان عمل أزرار HTML onclick داخل الـ Module
        window.editNovelItem = editNovelItem;
        window.deleteNovelItem = deleteNovelItem;

        // ربط نموذج الإرسال بالدالة غير المتزامنة
        document.getElementById('novel-form').addEventListener('submit', handleFormSubmit);

        window.onload = async function() {
            await initDatabase();
            await renderAdminTable();
        };
    </script>
</body>
</html>
