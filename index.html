<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <link rel="icon" type="image/png" href="img/riwayati.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayati</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { darkBg: '#0f172a', cardBg: '#1e293b' }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .logo { width: 20%; cursor: pointer; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <img class="logo" src="img/riwayati.png" alt="riwayati logo">
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Continue Reading Section -->
        <div id="continue-section" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="serif-title text-xl sm:text-2xl font-bold text-slate-100 flex items-center gap-2.5">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> Continue Reading
                </h2>
            </div>
            <div id="continue-grid" class="flex gap-4 overflow-x-auto pb-4 pt-1"></div>
        </div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/50 p-6 rounded-2xl border border-slate-800 shadow-xl backdrop-blur-sm">
            <div>
                <h1 class="serif-title text-3xl font-bold text-slate-100">Explore Novels</h1>
                <p class="text-slate-400 text-sm mt-1">Discover epic tales, romance, fantasy, and more. Click any novel to read.</p>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-3">
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Search title or author..." oninput="filterNovels()" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div class="relative w-full sm:w-48">
                    <select id="genre-filter" onchange="filterNovels()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all cursor-pointer">
                        <option value="">All Genres</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Novel Grid Container -->
        <div id="novel-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- Empty State -->
        <div id="empty-library" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 bg-slate-800/80 rounded-full flex items-center justify-center text-slate-500 text-3xl mb-4">
                <i class="fa-solid fa-book"></i>
            </div>
            <h3 class="text-xl font-semibold text-slate-300">No novels found</h3>
            <p class="text-slate-500 text-sm mt-1 max-w-sm">No novels match your search or the library is currently empty.</p>
        </div>
    </main>

    <footer class="mt-auto border-t border-slate-800/80 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Had Site khedmo Zinou echikor 😝, bayna machi bla ai bsh machi koulech b ai.</p>
    </footer>

    <script type="module" src="db.js"></script>
    <script type="module">
        async function renderContinueReading() {
            const history = JSON.parse(localStorage.getItem('continue_reading') || '{}');
            const keys = Object.keys(history);
            
            const continueSection = document.getElementById('continue-section');
            const continueGrid = document.getElementById('continue-grid');
            
            if (keys.length === 0) {
                continueSection.classList.add('hidden');
                return;
            }

            const novels = await getNovels();
            if (!Array.isArray(novels)) return;

            continueGrid.innerHTML = '';
            let hasItems = false;
            
            keys.sort((a, b) => history[b].timestamp - history[a].timestamp);

            keys.forEach(id => {
                const novel = novels.find(n => n.id === id);
                if (novel) {
                    hasItems = true;
                    const page = history[id].page || 1;
                    const card = document.createElement('a');
                    card.href = `reader.html?id=${novel.id}`;
                    card.className = "shrink-0 w-36 sm:w-44 bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden shadow-lg hover:border-indigo-500/50 transition-all duration-300 group flex flex-col";

                    card.innerHTML = `
                        <div class="h-44 sm:h-52 overflow-hidden relative bg-slate-800">
                            <img src="${novel.cover}" alt="${novel.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <button onclick="window.removeFromHistory('${novel.id}', event)" class="absolute top-2 right-2 bg-slate-900/80 text-rose-500 hover:text-rose-400 p-1.5 rounded-full backdrop-blur-md transition-colors shadow-lg z-20">
                                <i class="fa-solid fa-times text-xs"></i>
                            </button>
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent flex items-end p-2 pointer-events-none">
                                <span class="text-[10px] bg-indigo-600/90 text-white px-2 py-0.5 rounded-md font-semibold backdrop-blur-sm">Page ${page}</span>
                            </div>
                        </div>
                        <div class="p-3 bg-slate-900 flex-grow">
                            <h4 class="font-bold text-xs text-slate-100 group-hover:text-indigo-400 transition-colors line-clamp-1">${novel.title}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">By ${novel.author}</p>
                        </div>
                    `;
                    continueGrid.appendChild(card);
                }
            });

            if (hasItems) {
                continueSection.classList.remove('hidden');
            } else {
                continueSection.classList.add('hidden');
            }
        }

        window.removeFromHistory = function(id, e) {
            e.preventDefault();
            e.stopPropagation();

            let history = JSON.parse(localStorage.getItem('continue_reading') || '{}');
            delete history[id];
            localStorage.setItem('continue_reading', JSON.stringify(history));

            renderContinueReading();
        };

        window.filterNovels = async function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const genre = document.getElementById('genre-filter').value;
            const novels = await getNovels();
            
            if (!Array.isArray(novels)) return;
            const filtered = novels.filter(n => {
                const matchesQuery = n.title.toLowerCase().includes(query) || n.author.toLowerCase().includes(query);
                const matchesGenre = genre === "" || n.genre === genre;
                return matchesQuery && matchesGenre;
            });
            renderGrid(filtered);
        };

        async function populateGenres() {
            const novels = await getNovels();
            if (!Array.isArray(novels)) return;
            const genres = [...new Set(novels.map(n => n.genre))];
            const select = document.getElementById('genre-filter');
            select.innerHTML = '<option value="">All Genres</option>';
            genres.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });
        }

        async function renderGrid(data = null) {
            const novels = data || await getNovels();
            const grid = document.getElementById('novel-grid');
            const emptyState = document.getElementById('empty-library');
            
            grid.innerHTML = '';
            if (!Array.isArray(novels) || novels.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            novels.forEach(novel => {
                const card = document.createElement('a');
                card.href = `reader.html?id=${novel.id}`;
                card.className = "group bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-indigo-500/50 transition-all duration-300 flex flex-col";
                
                card.innerHTML = `
                    <div class="h-64 overflow-hidden relative bg-slate-800">
                        <img src="${novel.cover}" alt="${novel.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold text-indigo-400 border border-slate-700/50">
                            ${novel.genre}
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between space-y-3">
                        <div>
                            <h3 class="serif-title text-lg font-bold text-slate-100 group-hover:text-indigo-400 transition-colors line-clamp-1">${novel.title}</h3>
                            <p class="text-xs font-medium text-slate-400 mt-0.5">By ${novel.author}</p>
                            <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">${novel.desc}</p>
                        </div>
                        <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs font-medium text-indigo-400">
                            <span>Read Novel</span>
                            <i class="fa-solid fa-arrow-right transform group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = async function() {
            await initDatabase();
            await renderContinueReading();
            await populateGenres();
            await renderGrid();
        };
    </script>
</body>
</html>
