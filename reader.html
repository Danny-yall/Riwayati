<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <link rel="icon" type="image/png" href="img/riwayati.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayati - Reader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#0f172a' } } }
        }
    </script>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
        .logo { width: 20%; cursor: pointer; }
        #pdf-scroll-container::-webkit-scrollbar { width: 6px; }
        #pdf-scroll-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <img class="logo" src="img/riwayati.png" alt="riwayati logo">
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="reader-container" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Book Info Side -->
            <div class="space-y-6 flex flex-col items-center lg:items-start text-center lg:text-left">
                <div class="w-48 sm:w-56 h-72 sm:h-80 rounded-2xl overflow-hidden shadow-2xl border border-slate-700/80 bg-slate-800 shrink-0">
                    <img id="reader-cover" src="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x600/1e293b/94a3b8?text=No+Cover'">
                </div>
                <div class="space-y-2 w-full">
                    <span id="reader-genre" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"></span>
                    <h1 id="reader-title" class="serif-title text-2xl sm:text-3xl font-bold text-slate-100"></h1>
                    <p id="reader-author" class="text-slate-400 font-medium text-sm"></p>
                </div>

                <div class="w-full pt-4 border-t border-slate-800">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Synopsis</h3>
                    <p id="reader-desc" class="text-slate-300 text-sm leading-relaxed text-justify"></p>
                </div>
            </div>

            <!-- Scrollable PDF Viewer Area -->
            <div class="lg:col-span-2 flex flex-col h-[650px] sm:h-[750px] bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden shadow-inner">
                
                <!-- Viewer Toolbar -->
                <div class="bg-slate-900 px-4 py-3 border-b border-slate-800 flex items-center justify-between gap-2 flex-wrap">
                    <div class="flex items-center space-x-2 text-slate-300 text-sm font-medium truncate">
                        <i class="fa-solid fa-book-open text-indigo-400"></i>
                        <span id="reader-pdf-title" class="truncate max-w-[130px] sm:max-w-xs">Reading...</span>
                    </div>

                    <!-- Quick Page Jump Input -->
                    <div class="flex items-center space-x-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                        <div class="flex items-center space-x-1 text-xs text-slate-400 font-semibold">
                            <span>Page</span>
                            <input type="number" id="page-input" min="1" value="1" class="w-12 bg-slate-900 border border-slate-700 rounded-md py-0.5 text-center text-xs font-bold text-indigo-400 focus:outline-none focus:border-indigo-500">
                            <span>/ <span id="page-count">--</span></span>
                        </div>
                    </div>

                    <a id="download-link" href="#" target="_blank" class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-external-link"></i> <span class="hidden sm:inline">Raw PDF</span>
                    </a>
                </div>

                <!-- Scrollable Container for All Pages -->
                <div id="pdf-scroll-container" class="flex-1 overflow-auto flex flex-col items-center p-4 bg-slate-950/50 relative space-y-4">
                    <!-- Loading Spinner -->
                    <div id="pdf-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 z-10 space-y-3">
                        <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-3xl"></i>
                        <span class="text-xs text-slate-400 font-medium">Loading PDF document...</span>
                    </div>

                    <div id="canvas-wrapper" class="flex flex-col items-center space-y-4 w-full"></div>
                </div>
            </div>
        </div>

        <!-- Not Found State -->
        <div id="not-found" class="hidden flex-col items-center justify-center py-20 text-center">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-5xl mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-200">Novel Not Found</h2>
            <p class="text-slate-400 text-sm mt-1">The novel you are trying to read does not exist in the database.</p>
            <a href="index.html" class="mt-6 px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium">Return to Library</a>
        </div>
    </main>

    <script type="module" src="db.js"></script>
    <script type="module">
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentNovelId = null;
        let pdfDoc = null;
        let isProgrammaticScroll = false;
        const scale = 1.3;
        const scrollContainer = document.getElementById('pdf-scroll-container');
        const canvasWrapper = document.getElementById('canvas-wrapper');

        function saveProgress(page) {
            if (!currentNovelId || isProgrammaticScroll) return;
            let history = JSON.parse(localStorage.getItem('continue_reading') || '{}');
            history[currentNovelId] = {
                page: parseInt(page) || 1,
                timestamp: Date.now()
            };
            localStorage.setItem('continue_reading', JSON.stringify(history));
        }

        // Attach scroll listener immediately so it tracks from the start
        scrollContainer.addEventListener('scroll', () => {
            if (isProgrammaticScroll) return;

            const canvases = canvasWrapper.querySelectorAll('.pdf-page-canvas');
            if (canvases.length === 0) return;

            let closestPage = 1;
            let minDistance = Infinity;
            const containerTop = scrollContainer.getBoundingClientRect().top;

            canvases.forEach(canvas => {
                const rect = canvas.getBoundingClientRect();
                const distance = Math.abs(rect.top - containerTop);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestPage = parseInt(canvas.dataset.pageNumber);
                }
            });

            document.getElementById('page-input').value = closestPage;
            saveProgress(closestPage);
        });

        async function renderAllPages() {
            canvasWrapper.innerHTML = '';
            const numPages = pdfDoc.numPages;
            document.getElementById('page-count').textContent = numPages;

            // Get saved progress beforehand
            let history = JSON.parse(localStorage.getItem('continue_reading') || '{}');
            let startPage = history[currentNovelId]?.page || 1;
            if (startPage > numPages) startPage = 1;

            for (let i = 1; i <= numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: scale });

                const canvas = document.createElement('canvas');
                canvas.className = "shadow-2xl rounded-lg max-w-full mb-4 pdf-page-canvas";
                canvas.dataset.pageNumber = i;
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                canvasWrapper.appendChild(canvas);

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                // INSTANT JUMP: As soon as the saved page is rendered, jump to it immediately!
                if (i === startPage) {
                    document.getElementById('page-input').value = startPage;
                    scrollToPage(startPage, false);
                }
            }

            document.getElementById('pdf-loading').style.display = 'none';
        }

        function scrollToPage(pageNum, smooth = true) {
            isProgrammaticScroll = true;
            const targetCanvas = canvasWrapper.querySelector(`[data-page-number="${pageNum}"]`);
            if (targetCanvas) {
                targetCanvas.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
            }
            setTimeout(() => {
                isProgrammaticScroll = false;
            }, smooth ? 600 : 100);
        }

        const pageInput = document.getElementById('page-input');
        pageInput.addEventListener('change', function() {
            let requestedPage = parseInt(this.value);
            if (isNaN(requestedPage)) return;
            if (requestedPage < 1) requestedPage = 1;
            if (requestedPage > pdfDoc.numPages) requestedPage = pdfDoc.numPages;
            
            saveProgress(requestedPage);
            scrollToPage(requestedPage);
        });

        pageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                this.blur();
                let requestedPage = parseInt(this.value);
                if (!isNaN(requestedPage)) {
                    if (requestedPage < 1) requestedPage = 1;
                    if (requestedPage > pdfDoc.numPages) requestedPage = pdfDoc.numPages;
                    
                    saveProgress(requestedPage);
                    scrollToPage(requestedPage);
                }
            }
        });

        window.onload = async function() {
            await initDatabase();
            const params = new URLSearchParams(window.location.search);
            const novelId = params.get('id');
            currentNovelId = novelId;
            
            const novels = await getNovels();
            if (!Array.isArray(novels)) return;
            
            const novel = novels.find(n => n.id === novelId);

            if (!novel) {
                document.getElementById('reader-container').classList.add('hidden');
                const notFound = document.getElementById('not-found');
                notFound.classList.remove('hidden');
                notFound.classList.add('flex');
                return;
            }

            document.getElementById('reader-cover').src = novel.cover;
            document.getElementById('reader-title').innerText = novel.title;
            document.getElementById('reader-author').innerText = `By ${novel.author}`;
            document.getElementById('reader-genre').innerText = novel.genre;
            document.getElementById('reader-desc').innerText = novel.desc;
            document.getElementById('reader-pdf-title').innerText = novel.title;
            document.getElementById('download-link').href = novel.pdf;

            pdfjsLib.getDocument(novel.pdf).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                renderAllPages();
            }).catch(err => {
                console.error("PDF Load Error: ", err);
                document.getElementById('pdf-loading').innerHTML = `
                    <p class="text-rose-400 text-xs font-semibold">Failed to render PDF inside page.</p>
                    <a href="${novel.pdf}" target="_blank" class="px-3 py-1 bg-indigo-600 text-white text-xs rounded-lg mt-2">Open PDF directly</a>
                `;
            });
        };
    </script>
</body>
</html>
