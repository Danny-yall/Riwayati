<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <link rel="icon" type="image/png" href="img/riwayati.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayati</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#0f172a' } } }
        }
    </script>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
        .logo {width: 20%; cursor: pointer;}
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <img class="logo" src="img/riwayati.png" alt="riwayati logo">
               
                
            </a>
            
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="reader-container" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Book Info Side -->
            <div class="space-y-6 flex flex-col items-center lg:items-start text-center lg:text-left">
                <div class="w-48 sm:w-56 h-72 sm:h-80 rounded-2xl overflow-hidden shadow-2xl border border-slate-700/80 bg-slate-800 shrink-0">
                    <img id="reader-cover" src="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x600/1e293b/94a3b8?text=No+Cover'">
                </div>
                <div class="space-y-2 w-full">
                    <span id="reader-genre" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"></span>
                    <h1 id="reader-title" class="serif-title text-2xl sm:text-3xl font-bold text-slate-100"></h1>
                    <p id="reader-author" class="text-slate-400 font-medium text-sm"></p>
                </div>
                <div class="w-full pt-4 border-t border-slate-800">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Synopsis</h3>
                    <p id="reader-desc" class="text-slate-300 text-sm leading-relaxed text-justify"></p>
                </div>
            </div>

            <!-- Embedded PDF Frame -->
            <div class="lg:col-span-2 flex flex-col h-[750px] bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden shadow-inner">
                <div class="bg-slate-900 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                    <div class="flex items-center space-x-2 text-slate-300 text-sm font-medium">
                        <i class="fa-solid fa-book-reader text-indigo-400"></i>
                        <span id="reader-pdf-title">PDF Document</span>
                    </div>
                    <a id="download-link" href="#" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition-all shadow-md flex items-center">
                        <i class="fa-solid fa-external-link mr-1.5"></i> Open in New Window
                    </a>
                </div>
                <iframe id="pdf-frame" src="" class="w-full h-full border-0"></iframe>
            </div>
        </div>

        <!-- Not Found State -->
        <div id="not-found" class="hidden flex-col items-center justify-center py-20 text-center">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-5xl mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-200">Novel Not Found</h2>
            <p class="text-slate-400 text-sm mt-1">The novel you are trying to read does not exist in the database.</p>
            <a href="index.html" class="mt-6 px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium">Return to Library</a>
        </div>
    </main>

    <script type="module" src="db.js"></script>
    <script type="module">
        window.onload = async function() {
    await initDatabase();
    const params = new URLSearchParams(window.location.search);
    const novelId = params.get('id');
    
    // Await the asynchronous database fetch
    const novels = await getNovels();
    if (!Array.isArray(novels)) return;
    
    const novel = novels.find(n => n.id === novelId);

    if (!novel) {
        document.getElementById('reader-container').classList.add('hidden');
        document.getElementById('not-found').classList.remove('hidden');
        document.getElementById('not-found').classList.add('flex');
        return;
    }

    // Populate fields safely
    document.title = novel.title;
    document.getElementById('novel-title').innerText = novel.title;
    document.getElementById('novel-author').innerText = novel.author;
    document.getElementById('novel-desc').innerText = novel.desc;
    
    const coverImg = document.getElementById('novel-cover');
    if (novel.cover) {
        coverImg.src = novel.cover;
    } else {
        coverImg.alt = "No Cover Available";
    }

    const pdfFrame = document.getElementById('pdf-frame');
    if (novel.pdf) {
        pdfFrame.src = novel.pdf;
    }
};
    </script>
</body>
</html>
